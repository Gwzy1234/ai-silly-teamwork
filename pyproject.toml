[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "silly-teamwork"
version = "0.1.0"
description = "RESTful backend for the Silly Teamwork university collaboration system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2.0",
  "asyncpg>=0.30,<1.0",
  "email-validator>=2.2,<3.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.28,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "python-multipart>=0.0.20,<1.0",
  "sqlalchemy[asyncio]>=2.0.38,<3.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[project.scripts]
silly-teamwork-seed = "silly_teamwork.cli.seed:main"

[project.optional-dependencies]
dev = [
  "aiosqlite>=0.21,<1.0",
  "mypy>=1.14,<2.0",
  "pre-commit>=4.1,<5.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "pytest-cov>=6.0,<7.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/silly_teamwork"]

[tool.fastapi]
entrypoint = "silly_teamwork.main:app"

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
